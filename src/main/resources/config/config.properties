# Application Configuration
app.url=https://masumrazait.github.io/EPR/
app.title=Mannat Tech 2026 - Enterprise Employee Management System

# Browser Configuration
browser.type=chromium
browser.headless=false
browser.timeout=30000
browser.viewport.width=1920
browser.viewport.height=1080

# Environment Configuration
env=production
env.url=https://masumrazait.github.io/EPR/

# Screenshot Configuration
screenshot.on.failure=true
screenshot.path=./screenshots

# Report Configuration
report.path=./reports
report.format=html

# Log Configuration
log.level=INFO
log.path=./logs

# Test Data Configuration
testdata.path=src/test/resources/testdata

# Wait Configuration
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Email Notification Configuration
email.notification.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.username=your-email@gmail.com
email.password=your-app-password
email.from=your-email@gmail.com
email.recipients=recipient1@gmail.com,recipient2@gmail.com
